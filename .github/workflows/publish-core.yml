# Publishes @aisvision/quasidian-core to npm when a core-v* tag is
# pushed. The package versions independently from the app, so this runs
# on its own tag namespace and never collides with release.yml's v*.
#
# Authentication is npm trusted publishing (OIDC): the job exchanges
# GitHub's short-lived id-token for a registry credential, so no npm
# token exists anywhere — not in a secret, not on a laptop. The trusted
# publisher is configured on npmjs.com against this exact filename;
# renaming this file breaks publishing until it is reconfigured.
name: publish-core

on:
  push:
    tags: ["core-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Do NOT add registry-url here, however much npm's own example
      # suggests it: setup-node then writes an .npmrc carrying
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and the
      # runner fills it with a placeholder. npm reads that as "auth is
      # already configured", never starts the OIDC exchange, publishes
      # anonymously and fails with a 404 that reads like a missing
      # package. registry.npmjs.org is the default registry anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1, newer than what Node
      # bundles. Release builds also skip the dependency cache on
      # purpose: what gets published is built from a clean install.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - name: Check the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#core-v}"
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag core-v$TAG does not match package version $VERSION" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build -w @aisvision/quasidian-core

      # A configured token silently disables OIDC, and the publish then
      # fails with a 404 that looks like the package is missing. Catch
      # it here instead, where the message says what is wrong.
      - name: Refuse to publish with a registry token configured
        run: |
          TOKEN=$(npm config get //registry.npmjs.org/:_authToken)
          if [ -n "$TOKEN" ] && [ "$TOKEN" != "undefined" ]; then
            echo "A registry token is configured, so npm would skip the" >&2
            echo "OIDC exchange and publish anonymously. Something added" >&2
            echo "an .npmrc — setup-node's registry-url is the usual" >&2
            echo "culprit. Remove it; trusted publishing needs no token." >&2
            exit 1
          fi

      # Provenance attestations are generated automatically when the
      # publish is authenticated through OIDC.
      - name: Publish to npm
        working-directory: packages/core
        run: npm publish --access public
