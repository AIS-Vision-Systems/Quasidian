# Publishes @aisvision/quasidian-core to npm when a core-v* tag is
# pushed. The package versions independently from the app, so this runs
# on its own tag namespace and never collides with release.yml's v*.
#
# Authentication is npm trusted publishing (OIDC): the job exchanges
# GitHub's short-lived id-token for a registry credential, so no npm
# token exists anywhere — not in a secret, not on a laptop. The trusted
# publisher is configured on npmjs.com against this exact filename;
# renaming this file breaks publishing until it is reconfigured.
name: publish-core

on:
  push:
    tags: ["core-v*"]
  # Manual runs publish whatever version packages/core/package.json is
  # on. Retrying a failed publish otherwise means deleting and
  # re-pushing the tag, which is a lot of ceremony for a CI fix.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Do NOT add registry-url here, however much npm's own example
      # suggests it: setup-node then writes an .npmrc carrying
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and the
      # runner fills it with a placeholder. npm reads that as "auth is
      # already configured", never starts the OIDC exchange, publishes
      # anonymously and fails with a 404 that reads like a missing
      # package. registry.npmjs.org is the default registry anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1, newer than what Node
      # bundles. Release builds also skip the dependency cache on
      # purpose: what gets published is built from a clean install.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@latest
          npm --version

      # A manual run has no tag to check against; it publishes whatever
      # version the branch carries.
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#core-v}"
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag core-v$TAG does not match package version $VERSION" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build -w @aisvision/quasidian-core

      # ENEEDAUTH at the publish step is ambiguous: either GitHub never
      # handed out an id-token, or it did and npm's exchange with the
      # registry was refused (no trusted publisher, or one whose repo,
      # workflow filename or environment does not match this run). This
      # separates the two — only the value's presence is reported, and
      # the token itself is never printed.
      - name: Check GitHub is providing an OIDC token
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "No OIDC token endpoint in the environment, so" >&2
            echo "id-token: write is not taking effect — the problem is" >&2
            echo "on the GitHub side, not on npmjs.com." >&2
            exit 1
          fi
          echo "OIDC token endpoint present; GitHub's side is working."
          echo "If the publish still fails to authenticate, the trusted"
          echo "publisher on npmjs.com is what does not match: it must"
          echo "name repository ${GITHUB_REPOSITORY}, workflow file"
          echo "publish-core.yml, and no environment."

      # A configured token silently disables OIDC, and the publish then
      # fails with a 404 that looks like the package is missing. Catch
      # it here instead, where the message says what is wrong. The
      # npmrc files are read directly because `npm config get` refuses
      # to return _authToken — it is a protected value, and asking for
      # it exits non-zero, which under `bash -e` fails the step whether
      # or not a token is there.
      - name: Refuse to publish with a registry token configured
        run: |
          found=""
          for f in "$NPM_CONFIG_USERCONFIG" "$HOME/.npmrc" ".npmrc" "packages/core/.npmrc"; do
            if [ -n "$f" ] && [ -f "$f" ] && grep -q "_authToken" "$f"; then
              found="$found $f"
            fi
          done
          if [ -n "$found" ]; then
            echo "A registry token is configured in:$found" >&2
            echo "npm would skip the OIDC exchange and publish anonymously." >&2
            echo "setup-node's registry-url is the usual culprit — remove" >&2
            echo "it; trusted publishing needs no token at all." >&2
            exit 1
          fi
          echo "No registry token configured; the OIDC exchange can proceed."

      # Provenance attestations are generated automatically when the
      # publish is authenticated through OIDC.
      - name: Publish to npm
        working-directory: packages/core
        run: npm publish --access public
