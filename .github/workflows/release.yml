# Release pipeline: pushing a tag v* creates a draft release in this
# repository, builds the installers on Windows and Ubuntu, uploads them,
# and publishes the release once every installer is up — the in-app
# update check reads the latest published release via the GitHub API.
# Uses the workflow's own GITHUB_TOKEN; no cross-repo secret needed.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to release with the placeholder updater key
        run: |
          THROWAWAY="dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDg5NzhBODI1MjYxNEQ3QzIKUldUQzF4UW1KYWg0aVJkRVlhaEQwSnVZd1Nyd01LMy9tcVFmWUZSMEdsM1owNk84TjczNGpCeHgK"
          PUBKEY=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")
          if [ "$PUBKEY" = "$THROWAWAY" ]; then
            echo "tauri.conf.json still carries the throwaway dev updater key (m43)." >&2
            echo "Generate the real pair (tauri signer generate), store the private" >&2
            echo "key and password as TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) secrets," >&2
            echo "put the real PUBLIC key in plugins.updater.pubkey, then re-tag." >&2
            exit 1
          fi

      - name: Check the tag matches the app version everywhere
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NPM_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          for VERSION in "$NPM_VERSION" "$TAURI_VERSION" "$CARGO_VERSION"; do
            if [ "$TAG" != "$VERSION" ]; then
              echo "Tag v$TAG does not match app version $VERSION" >&2
              exit 1
            fi
          done

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Draft: releases/latest (and the app's update check) only
          # advertises the version once every installer is uploaded.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Quasidian ${GITHUB_REF_NAME#v}" \
              --notes "Quasidian ${GITHUB_REF_NAME#v}"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      # createUpdaterArtifacts signs every bundle with the release key
      # (m43); the .sig files ride along to the draft release and the
      # publish job folds them into the updater manifest.
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload the installers and signatures to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          )
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --clobber "${files[@]}"

  # Publishing is what makes releases/latest — and both update flows —
  # see the new version, so it waits until every installer is up. The
  # updater manifest is attached BEFORE undrafting: the release only
  # ever becomes visible complete (the m35 atomicity guarantee).
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Build and attach the updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir sigs && cd sigs
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.sig'
          EXE_SIG=$(ls *.exe.sig | head -1)
          APPIMAGE_SIG=$(ls *.AppImage.sig | head -1)
          EXE_NAME="${EXE_SIG%.sig}"
          APPIMAGE_NAME="${APPIMAGE_SIG%.sig}"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "Quasidian $VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg winsig "$(cat "$EXE_SIG")" \
            --arg winurl "$BASE/$(printf %s "$EXE_NAME" | jq -sRr @uri)" \
            --arg linsig "$(cat "$APPIMAGE_SIG")" \
            --arg linurl "$BASE/$(printf %s "$APPIMAGE_NAME" | jq -sRr @uri)" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "windows-x86_64": { signature: $winsig, url: $winurl },
                "linux-x86_64": { signature: $linsig, url: $linurl }
              }
            }' > latest.json
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --clobber latest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft=false
