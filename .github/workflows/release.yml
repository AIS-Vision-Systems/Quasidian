# Release pipeline: pushing a tag v* creates a draft release in this
# repository, builds the installers on Windows and Ubuntu, uploads them,
# and publishes the release once every installer is up — the in-app
# update check reads the latest published release via the GitHub API.
# Uses the workflow's own GITHUB_TOKEN; no cross-repo secret needed.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version everywhere
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NPM_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          for VERSION in "$NPM_VERSION" "$TAURI_VERSION" "$CARGO_VERSION"; do
            if [ "$TAG" != "$VERSION" ]; then
              echo "Tag v$TAG does not match app version $VERSION" >&2
              exit 1
            fi
          done

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Draft: releases/latest (and the app's update check) only
          # advertises the version once every installer is uploaded.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Quasidian ${GITHUB_REF_NAME#v}" \
              --notes "Quasidian ${GITHUB_REF_NAME#v}"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Upload the installers to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          )
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --clobber "${files[@]}"

  # Publishing is what makes releases/latest — and the update check —
  # see the new version, so it waits until every installer is up.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft=false
