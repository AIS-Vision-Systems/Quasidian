# Release pipeline: pushing a tag v* builds the installers on Windows
# and Ubuntu and publishes everything to the public distribution repo
# (Quasidian-releases): the release assets and the latest.json feed the
# app's update check polls. Needs the RELEASES_TOKEN secret — a
# fine-grained PAT with Contents read/write on Quasidian-releases.
name: release

on:
  push:
    tags: ["v*"]

env:
  DIST_REPO: XaviAnguera/Quasidian-releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Publish the installers to the distribution repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # Both matrix jobs race to create the release; losing is fine.
          gh release view "$GITHUB_REF_NAME" --repo "$DIST_REPO" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$DIST_REPO" \
              --title "Quasidian ${GITHUB_REF_NAME#v}" \
              --notes "Quasidian ${GITHUB_REF_NAME#v}" || true
          shopt -s nullglob
          files=(
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          )
          gh release upload "$GITHUB_REF_NAME" --repo "$DIST_REPO" \
            --clobber "${files[@]}"

  # The feed only advertises the new version once every installer is up.
  publish-feed:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Point latest.json at the new version
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          printf '{\n  "version": "%s",\n  "url": "https://github.com/%s/releases/latest",\n  "notes": ""\n}\n' \
            "$VERSION" "$DIST_REPO" > latest.json
          CONTENT=$(base64 -w0 latest.json)
          SHA=$(gh api "repos/$DIST_REPO/contents/latest.json" --jq .sha)
          gh api -X PUT "repos/$DIST_REPO/contents/latest.json" \
            -f message="Update feed to $VERSION" \
            -f content="$CONTENT" \
            -f sha="$SHA"
